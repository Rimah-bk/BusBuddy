<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusBuddy - Log in</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #0F6E56;
      color: white;
      padding: 15px 20px;
      font-size: 22px;
      font-weight: bold;
    }

    .login-box {
      max-width: 360px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    h2 { margin-top: 0; text-align: center; }

    label { display: block; margin-bottom: 5px; font-weight: bold; }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #aaa;
      border-radius: 5px;
      font-size: 15px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0F6E56;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #08503F; }

    .links { text-align: center; margin-top: 15px; font-size: 14px; line-height: 1.8; }
    .links a { color: #0F6E56; }

    #message { text-align: center; font-size: 14px; margin-bottom: 10px; color: #A32D2D; }

    #json-output {
      display: none;
      background: #f7f7f7;
      border: 1px dashed #999;
      padding: 10px;
      font-size: 13px;
      white-space: pre-wrap;
      margin-top: 15px;
    }

    /* Placeholder box for the mobile application */
    .mobile-placeholder {
      max-width: 360px;
      margin: 0 auto 40px;
      padding: 20px;
      border: 2px dashed #534AB7;
      border-radius: 8px;
      text-align: center;
      color: #534AB7;
      background: white;
    }
    .mobile-placeholder code {
      display: block;
      margin-top: 8px;
      color: #222;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <header>BusBuddy</header>

  <!-- ================= LOGIN FORM ================= -->
  <div class="login-box">
    <h2>Log in</h2>

    <div id="message"></div>

    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="name@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Your password" required>

      <button type="submit">Log in</button>
    </form>

    <div class="links">
      <a href="#">Forgot password?</a><br>
      New user? <a href="register.html">Create an account</a><br>
      <a href="map.html">View the live bus map without logging in</a>
    </div>

    <!-- Shows the JSON that will be sent (for testing only) -->
    <div id="json-output"></div>
  </div>

  <!-- ================= MOBILE APP PLACEHOLDER ================= -->
  <div class="mobile-placeholder">
    <strong>Mobile application login</strong><br>
    Placeholder: the mobile app will use the same login through this JSON link:
    <code id="json-link-display"></code>
  </div>

  <script>
    // ==========================================================
    // PLACEHOLDER: JSON link shared with the mobile application.
    // Replace this with the real link when the backend is ready.
    // ==========================================================
    const LOGIN_JSON_URL = "https://YOUR-SERVER-LINK/api/login.json";

    // Show the link inside the mobile placeholder box
    document.getElementById("json-link-display").textContent = LOGIN_JSON_URL;

    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    const jsonOutput = document.getElementById("json-output");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (email === "" || password === "") {
        message.textContent = "Please enter your email and password.";
        return;
      }
      message.textContent = "";

      // The data that will be sent as JSON to LOGIN_JSON_URL
      const loginData = {
        email: email,
        password: password,
        platform: "web"        // the mobile app will send "mobile"
      };

      // NOT CONNECTED YET: for now, only display the JSON.
      // When the backend is ready, replace the two lines below with:
      //
      // fetch(LOGIN_JSON_URL, {
      //   method: "POST",
      //   headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify(loginData)
      // })
      //   .then(response => response.json())
      //   .then(result => { /* go to the user's page */ });

      jsonOutput.style.display = "block";
      jsonOutput.textContent = "JSON to send to " + LOGIN_JSON_URL + ":\n" +
        JSON.stringify({ ...loginData, password: "********" }, null, 2);
    });
  </script>

</body>
</html>
